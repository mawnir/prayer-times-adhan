<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prayer Times &amp; Adhan - 7-Day Schedule &amp; Notifications</title>
    <meta name="description" content="Multi-location Islamic prayer times schedule for the upcoming week with customizable adhan notifications, Qibla compass, and audio alerts." />
    <meta property="og:title" content="Prayer Times &amp; Adhan" />
    <meta property="og:description" content="Multi-location Islamic prayer times schedule for the upcoming week with customizable adhan notifications, Qibla compass, and audio alerts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme and language before first paint.
      (function () {
        try {
          var t = localStorage.getItem('pt_theme');
          var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');

          var savedLanguage = localStorage.getItem('pt_language');
          var language = savedLanguage === 'ar' || savedLanguage === 'en'
            ? savedLanguage
            : ((navigator.language || '').indexOf('ar') === 0 ? 'ar' : 'en');
          document.documentElement.lang = language;
          document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
          if (language === 'ar') {
            document.title = 'أوقات الصلاة والأذان';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
